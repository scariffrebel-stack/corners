<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corners</title>
<style>
  :root {
    --bg: #0f1a14; --card: #18271e; --line: #2a3d31; --text: #eef5ef; --muted: #9db3a3;
    --accent: #f5c542; --good: #4ade80; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 16px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .badge { text-align: center; padding: 22px 12px; }
  .badge .flag { font-size: 44px; }
  .badge .who { font-size: 30px; font-weight: 700; color: var(--accent); margin: 4px 0; }
  .meta { color: var(--muted); font-size: 14px; }
  .stats { display: flex; justify-content: center; gap: 28px; margin-top: 12px; }
  .stats b { display: block; font-size: 24px; }
  ol, ul { margin: 0; padding: 0; list-style: none; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); gap: 8px; }
  li:last-child { border-bottom: 0; }
  li.holder { color: var(--accent); font-weight: 700; }
  button, input, select { font: inherit; border-radius: 10px; border: 1px solid var(--line); padding: 10px 12px; background: #0c140f; color: var(--text); }
  button { background: var(--accent); color: #1b1b1b; border: 0; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button.small { padding: 4px 10px; font-size: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > input, .row > select { flex: 1; min-width: 0; }
  input.stake { width: 80px; flex: none; }
  .err { color: var(--bad); font-size: 14px; min-height: 1em; }
  .warn { color: var(--accent); font-size: 14px; }
  .hidden { display: none; }
  details summary { cursor: pointer; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>⚑ Corners</h1>

  <section id="live" class="hidden">
    <div class="badge">
      <div class="flag">⚑</div>
      <div class="meta">Corner badge</div>
      <div class="who" id="holder"></div>
      <div class="meta" id="matchLabel"></div>
      <div class="stats">
        <div><b id="corners">0</b><span class="meta">corners</span></div>
        <div><b id="pot">0</b><span class="meta">tokens in pot</span></div>
      </div>
      <div class="meta" id="feedNote" style="margin-top:10px"></div>
    </div>
    <h2>Order</h2>
    <ol id="order"></ol>
    <details style="margin-top:12px">
      <summary>Backup controls</summary>
      <p class="meta">Use these only if the live feed is wrong or stuck.</p>
      <div class="row">
        <button class="ghost" data-act="corner" data-delta="1">+1 corner</button>
        <button class="ghost" data-act="corner" data-delta="-1">−1 corner</button>
        <button class="ghost" data-act="settle" data-confirm="End the match now and pay the badge holder?">Full time</button>
        <button class="ghost" data-act="abandon" data-confirm="Call off the match and refund every stake?">Abandon</button>
      </div>
    </details>
  </section>

  <section id="setup" class="hidden">
    <h2>New match</h2>
    <div class="row">
      <input type="date" id="date">
      <button class="ghost" id="loadFixtures">Find matches</button>
    </div>
    <div class="row" style="margin-top:8px"><select id="fixture"><option value="">Pick a Premier League match</option></select></div>
    <p class="meta">Each player sets their own stake. Leave it blank to sit this one out.</p>
    <ul id="stakes"></ul>
    <div class="row" style="margin-top:10px"><button id="start">Shuffle and start</button></div>
  </section>

  <section>
    <h2>Season table</h2>
    <ul id="table"></ul>
    <div class="row" style="margin-top:10px">
      <input id="newName" placeholder="Add a player" maxlength="30">
      <button id="add">Add</button>
    </div>
  </section>

  <section>
    <h2>Results</h2>
    <ul id="history"></ul>
    <div class="row" style="margin-top:10px">
      <button class="ghost small" data-act="newSeason" data-confirm="Reset everyone's tokens and clear the results?">New season</button>
    </div>
  </section>

  <div class="err" id="err"></div>
</main>
<script>
let state = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const name = (id) => state.players[id]?.name || 'Someone';

function pin() {
  if (!state?.pinRequired) return undefined;
  let p = null;
  try { p = localStorage.getItem('corners-pin'); } catch {}
  if (!p) {
    p = prompt('Game PIN');
    try { if (p) localStorage.setItem('corners-pin', p); } catch {}
  }
  return p;
}

async function act(type, extra = {}) {
  $('err').textContent = '';
  const r = await fetch('/api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type, pin: pin(), ...extra }) });
  const body = await r.json();
  if (!r.ok) {
    if (r.status === 403) try { localStorage.removeItem('corners-pin'); } catch {}
    $('err').textContent = body.error || 'Something went wrong';
    return;
  }
  state = body;
  render();
}

async function refresh() {
  try {
    const r = await fetch('/api/state');
    const body = await r.json();
    if (!r.ok) throw new Error(body.error);
    state = body;
    render();
  } catch (e) {
    $('err').textContent = 'Can’t reach the game: ' + e.message;
  }
}

function render() {
  const m = state.match;
  $('live').classList.toggle('hidden', !m);
  $('setup').classList.toggle('hidden', !!m);

  if (m) {
    $('holder').textContent = name(m.holder);
    $('matchLabel').textContent = m.label;
    $('corners').textContent = m.corners;
    $('pot').textContent = m.pot;
    const before = Date.now() < m.kickoff;
    $('feedNote').innerHTML = m.feedError
      ? `<span class="warn">Live feed problem: ${esc(m.feedError)}</span>`
      : before ? `Kicks off ${new Date(m.kickoff).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}. ${esc(name(m.order[0]))} starts with the badge.`
      : `Live · status ${esc(m.feedStatus)} · checks every ${state.pollSeconds}s` + (m.manualAdjust ? ` · ${m.manualAdjust > 0 ? '+' : ''}${m.manualAdjust} by hand` : '');
    $('order').innerHTML = m.order.map((id, i) =>
      `<li class="${id === m.holder ? 'holder' : ''}"><span>${i + 1}. ${esc(name(id))}${id === m.holder ? ' ⚑' : ''}</span><span class="meta">${m.stakes[id]} staked</span></li>`).join('');
  } else {
    const keep = {};
    document.querySelectorAll('#stakes input').forEach((el) => { keep[el.dataset.id] = el.value; });
    $('stakes').innerHTML = Object.entries(state.players).map(([id, p]) =>
      `<li><span>${esc(p.name)} <span class="meta">(${p.tokens})</span></span><input class="stake" type="number" min="1" max="${p.tokens}" inputmode="numeric" data-id="${id}" value="${esc(keep[id] || '')}" placeholder="—"></li>`).join('')
      || '<li class="meta">Add players below first.</li>';
  }

  const rows = Object.entries(state.players).sort((a, b) => b[1].tokens - a[1].tokens);
  $('table').innerHTML = rows.map(([id, p], i) =>
    `<li><span>${i + 1}. ${esc(p.name)}</span><span><b>${p.tokens}</b> <button class="ghost small" data-remove="${id}" title="Remove">✕</button></span></li>`).join('')
    || '<li class="meta">No players yet.</li>';

  $('history').innerHTML = state.history.map((h) => h.abandoned
    ? `<li><span>${esc(h.label)}</span><span class="meta">abandoned, stakes refunded</span></li>`
    : `<li><span>${esc(h.label)}<br><span class="meta">${h.corners} corners</span></span><span>${esc(name(h.winner))} won <b>${h.pot}</b></span></li>`).join('')
    || '<li class="meta">No matches yet.</li>';
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.remove) {
    if (confirm(`Remove ${name(b.dataset.remove)} and their tokens?`)) act('removePlayer', { id: b.dataset.remove });
  } else if (b.dataset.act) {
    if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
    act(b.dataset.act, b.dataset.delta ? { delta: Number(b.dataset.delta) } : {});
  }
});

$('add').onclick = () => {
  const n = $('newName').value.trim();
  if (n) act('addPlayer', { name: n }).then(() => { $('newName').value = ''; });
};
$('newName').onkeydown = (e) => { if (e.key === 'Enter') $('add').click(); };

$('date').value = new Date().toISOString().slice(0, 10);
$('loadFixtures').onclick = async () => {
  $('err').textContent = '';
  const r = await fetch('/api/fixtures?date=' + $('date').value);
  const body = await r.json();
  if (!r.ok || body.error) { $('err').textContent = body.error || 'Could not load matches'; return; }
  $('fixture').innerHTML = body.fixtures.length
    ? body.fixtures.map((f) => `<option value="${esc(f.id)}" data-label="${esc(f.label)}" data-kickoff="${esc(f.kickoff)}">${esc(f.label)} · ${new Date(f.kickoff).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</option>`).join('')
    : '<option value="">No Premier League matches that day</option>';
};

$('start').onclick = () => {
  const opt = $('fixture').selectedOptions[0];
  const stakes = {};
  document.querySelectorAll('#stakes input').forEach((el) => { if (el.value) stakes[el.dataset.id] = Number(el.value); });
  act('startMatch', { fixtureId: opt?.value, label: opt?.dataset.label, kickoff: opt?.dataset.kickoff, stakes });
};

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
