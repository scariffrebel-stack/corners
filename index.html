<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corners</title>
<meta name="theme-color" content="#0b1f14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1f14; --panel: #12301f; --deep: #0e2719; --line: #1d4430;
    --text: #eaf3ec; --soft: #c9ddcf; --muted: #9fc1aa; --accent: #ffd23f; --bad: #ff8a80;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 'Barlow', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  main { max-width: 480px; margin: 0 auto; padding: 0 0 32px; }
  .cond { font-family: 'Barlow Condensed', 'Barlow', sans-serif; }
  header { padding: 20px 20px 0; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font: 800 22px 'Barlow Condensed', sans-serif; letter-spacing: .08em; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--bg); background: var(--accent); padding: 4px 10px; border-radius: 999px; }
  .pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--bg); }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  section { margin: 16px 20px 0; }
  section.card { background: var(--deep); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .scoreboard { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--panel); border-radius: 12px; overflow: hidden; }
  .scoreboard > div { padding: 12px 6px; text-align: center; border-right: 1px solid var(--line); min-width: 0; }
  .scoreboard > div:last-child { border-right: 0; }
  .scoreboard span { display: block; font-size: 12px; letter-spacing: .06em; color: var(--muted); }
  .scoreboard b { display: block; font: 700 20px 'Barlow Condensed', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 0 20px; text-align: center; }
  .hero .label { font-size: 14px; letter-spacing: .14em; color: var(--muted); }
  .hero .who { font: 800 clamp(52px, 18vw, 76px)/0.95 'Barlow Condensed', sans-serif; color: var(--accent); text-transform: uppercase; word-break: break-word; }
  .hero .next { font-size: 15px; color: var(--soft); }
  .hero .next b { color: #fff; }
  .flag path { fill: var(--accent); }
  .flag.wave { animation: wave .6s ease-in-out 2; transform-origin: 20px 116px; }
  @keyframes wave { 50% { transform: rotate(-8deg); } }
  .note { font-size: 13px; color: var(--muted); text-align: center; }
  ol, ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  li { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 44px; padding: 8px 12px; border-radius: 10px; background: var(--panel); }
  li.holder { background: var(--accent); color: var(--bg); font-weight: 600; }
  li.plain { background: none; padding: 4px 0; min-height: 0; }
  .meta { color: var(--muted); font-size: 14px; }
  li.holder .meta { color: var(--bg); }
  button, input, select { font: inherit; border-radius: 10px; border: 1px solid var(--line); min-height: 44px; padding: 10px 12px; background: var(--bg); color: var(--text); }
  button { background: var(--accent); color: var(--bg); border: 0; font-weight: 700; cursor: pointer; }
  button.big { width: 100%; font: 800 20px 'Barlow Condensed', sans-serif; letter-spacing: .06em; text-transform: uppercase; }
  button.ghost { background: transparent; color: var(--soft); border: 1px solid var(--line); font-weight: 500; }
  button.small { min-height: 36px; padding: 4px 10px; font-size: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > input, .row > select { flex: 1; min-width: 0; }
  input.stake { width: 84px; flex: none; text-align: center; min-height: 40px; }
  .err { color: var(--bad); font-size: 14px; margin: 16px 20px 0; }
  .err:empty { display: none; }
  .warn { color: var(--accent); }
  .hidden { display: none !important; }
  details summary { cursor: pointer; color: var(--muted); min-height: 44px; display: flex; align-items: center; }
  .ladder li .tok { font: 700 18px 'Barlow Condensed', sans-serif; }
</style>
</head>
<body>
<main>
  <header>
    <h1>CORNERS</h1>
    <span class="pill hidden" id="livePill">LIVE</span>
  </header>

  <div id="live" class="hidden">
    <section class="scoreboard">
      <div><span>MATCH</span><b id="matchLabel"></b></div>
      <div><span>CORNERS</span><b id="corners">0</b></div>
      <div><span>POT</span><b id="pot">0</b></div>
    </section>
    <section class="hero">
      <svg class="flag" id="flag" width="96" height="120" viewBox="0 0 96 120" aria-hidden="true">
        <line x1="20" y1="8" x2="20" y2="116" stroke="#eaf3ec" stroke-width="5" stroke-linecap="round"></line>
        <path d="M22 10 L84 28 L22 50 Z"></path>
      </svg>
      <div class="label">HOLDING THE BADGE</div>
      <div class="who" id="holder"></div>
      <div class="next" id="next"></div>
      <div class="note" id="feedNote"></div>
      <div class="row hidden" id="manualControls" style="width:100%;margin-top:8px">
        <button class="big" data-act="corner" data-delta="1" style="flex:1">+1 Corner</button>
        <button class="ghost" data-act="corner" data-delta="-1" aria-label="Undo last corner">Undo</button>
        <button class="ghost" data-act="settle" data-confirm="Blow full time and pay the badge holder?">Full time</button>
      </div>
    </section>
    <section class="card">
      <h2>Order</h2>
      <ol id="order"></ol>
      <details id="backup" style="margin-top:8px">
        <summary>Backup controls</summary>
        <p class="meta" style="margin-top:0">Use these only if the live feed is wrong or stuck.</p>
        <div class="row">
          <button class="ghost" data-act="corner" data-delta="1">+1 corner</button>
          <button class="ghost" data-act="corner" data-delta="-1">−1 corner</button>
          <button class="ghost" data-act="settle" data-confirm="End the match now and pay the badge holder?">Full time</button>
          <button class="ghost" data-act="abandon" data-confirm="Call off the match and refund every stake?">Abandon</button>
        </div>
      </details>
    </section>
  </div>

  <section id="setup" class="card hidden">
    <h2>New match</h2>
    <div class="row">
      <input type="date" id="date">
      <button class="ghost" id="loadFixtures">Find matches</button>
    </div>
    <div class="row" style="margin-top:8px"><select id="fixture"><option value="">Pick a Premier League match</option><option value="manual" data-label="Test match">Test match (tap corners yourself)</option></select></div>
    <p class="meta">Each player sets their own stake. Leave it blank to sit this one out.</p>
    <ul id="stakes"></ul>
    <div class="row" style="margin-top:12px"><button class="big" id="start">Shuffle and start</button></div>
  </section>

  <section class="card">
    <h2>Season table</h2>
    <ul id="table" class="ladder"></ul>
    <div class="row" style="margin-top:10px">
      <input id="newName" placeholder="Add a player" maxlength="30">
      <button id="add">Add</button>
    </div>
  </section>

  <section class="card">
    <h2>Results</h2>
    <ul id="history"></ul>
    <div class="row" style="margin-top:10px">
      <button class="ghost small" data-act="newSeason" data-confirm="Reset everyone's tokens and clear the results?">New season</button>
    </div>
  </section>

  <div class="err" id="err"></div>
</main>
<script>
let state = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const name = (id) => state.players[id]?.name || 'Someone';

function pin() {
  if (!state?.pinRequired) return undefined;
  let p = null;
  try { p = localStorage.getItem('corners-pin'); } catch {}
  if (!p) {
    p = prompt('Game PIN');
    try { if (p) localStorage.setItem('corners-pin', p); } catch {}
  }
  return p;
}

async function act(type, extra = {}) {
  $('err').textContent = '';
  const r = await fetch('/api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type, pin: pin(), ...extra }) });
  const body = await r.json();
  if (!r.ok) {
    if (r.status === 403) try { localStorage.removeItem('corners-pin'); } catch {}
    $('err').textContent = body.error || 'Something went wrong';
    return;
  }
  state = body;
  render();
}

async function refresh() {
  try {
    const r = await fetch('/api/state');
    const body = await r.json();
    if (!r.ok) throw new Error(body.error);
    state = body;
    render();
  } catch (e) {
    $('err').textContent = 'Can’t reach the game: ' + e.message;
  }
}

let lastHolder = null;
// "Arsenal v Chelsea" -> "ARS v CHE" so it fits the scoreboard
function shortLabel(label) {
  const parts = String(label).split(' v ');
  return parts.length === 2 ? parts.map((t) => t.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase()).join(' v ') : label;
}

function render() {
  const m = state.match;
  $('live').classList.toggle('hidden', !m);
  $('setup').classList.toggle('hidden', !!m);

  $('livePill').classList.toggle('hidden', !m || Date.now() < m.kickoff);
  $('livePill').textContent = m?.fixtureId === 'manual' ? 'TEST' : 'LIVE';
  if (m) {
    if (lastHolder && lastHolder !== m.holder) {
      $('flag').classList.remove('wave'); void $('flag').getBoundingClientRect(); $('flag').classList.add('wave');
    }
    lastHolder = m.holder;
    const nextId = m.order[(m.order.indexOf(m.holder) + 1) % m.order.length];
    $('holder').textContent = name(m.holder);
    $('next').innerHTML = `Next corner passes it to <b>${esc(name(nextId))}</b>`;
    $('matchLabel').textContent = shortLabel(m.label);
    $('corners').textContent = m.corners;
    $('pot').textContent = m.pot;
    const before = Date.now() < m.kickoff;
    const manual = m.fixtureId === 'manual';
    $('manualControls').classList.toggle('hidden', !manual);
    $('backup').classList.toggle('hidden', manual);
    $('feedNote').innerHTML = manual ? 'Test match · tap +1 Corner each time one is awarded' : m.feedError
      ? `<span class="warn">Live feed problem: ${esc(m.feedError)}</span>`
      : before ? `Kicks off ${new Date(m.kickoff).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`
      : `Live feed updates every ${state.pollSeconds}s` + (m.manualAdjust ? ` · ${m.manualAdjust > 0 ? '+' : ''}${m.manualAdjust} by hand` : '');
    $('order').innerHTML = m.order.map((id, i) =>
      `<li class="${id === m.holder ? 'holder' : ''}"><span>${i + 1} · ${esc(name(id))}</span><span class="meta">${m.stakes[id]}</span></li>`).join('');
  } else {
    const keep = {};
    document.querySelectorAll('#stakes input').forEach((el) => { keep[el.dataset.id] = el.value; });
    $('stakes').innerHTML = Object.entries(state.players).map(([id, p]) =>
      `<li><span>${esc(p.name)} <span class="meta">(${p.tokens})</span></span><input class="stake" type="number" min="1" max="${p.tokens}" inputmode="numeric" data-id="${id}" value="${esc(keep[id] || '')}" placeholder="—"></li>`).join('')
      || '<li class="meta plain">Add players below first.</li>';
  }

  const rows = Object.entries(state.players).sort((a, b) => b[1].tokens - a[1].tokens);
  $('table').innerHTML = rows.map(([id, p], i) =>
    `<li><span>${i + 1}. ${esc(p.name)}</span><span><span class="tok">${p.tokens}</span> <button class="ghost small" data-remove="${id}" title="Remove">✕</button></span></li>`).join('')
    || '<li class="meta plain">No players yet.</li>';

  $('history').innerHTML = state.history.map((h) => h.abandoned
    ? `<li><span>${esc(h.label)}</span><span class="meta">abandoned, stakes refunded</span></li>`
    : `<li><span>${esc(h.label)}<br><span class="meta">${h.corners} corners</span></span><span>${esc(name(h.winner))} won <b>${h.pot}</b></span></li>`).join('')
    || '<li class="meta plain">No matches yet.</li>';
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.remove) {
    if (confirm(`Remove ${name(b.dataset.remove)} and their tokens?`)) act('removePlayer', { id: b.dataset.remove });
  } else if (b.dataset.act) {
    if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
    act(b.dataset.act, b.dataset.delta ? { delta: Number(b.dataset.delta) } : {});
  }
});

$('add').onclick = () => {
  const n = $('newName').value.trim();
  if (n) act('addPlayer', { name: n }).then(() => { $('newName').value = ''; });
};
$('newName').onkeydown = (e) => { if (e.key === 'Enter') $('add').click(); };

const TEST_OPTION = '<option value="manual" data-label="Test match">Test match (tap corners yourself)</option>';
$('date').value = new Date().toISOString().slice(0, 10);
$('loadFixtures').onclick = async () => {
  $('err').textContent = '';
  const r = await fetch('/api/fixtures?date=' + $('date').value);
  const body = await r.json();
  if (!r.ok || body.error) { $('err').textContent = body.error || 'Could not load matches'; return; }
  $('fixture').innerHTML = TEST_OPTION + (body.fixtures.length
    ? body.fixtures.map((f) => `<option value="${esc(f.id)}" data-label="${esc(f.label)}" data-kickoff="${esc(f.kickoff)}">${esc(f.label)} · ${new Date(f.kickoff).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</option>`).join('')
    : '<option value="">No Premier League matches that day</option>');
};

$('start').onclick = () => {
  const opt = $('fixture').selectedOptions[0];
  const stakes = {};
  document.querySelectorAll('#stakes input').forEach((el) => { if (el.value) stakes[el.dataset.id] = Number(el.value); });
  act('startMatch', { fixtureId: opt?.value, label: opt?.dataset.label, kickoff: opt?.dataset.kickoff, stakes });
};

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
